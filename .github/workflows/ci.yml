name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: learnhub
          POSTGRES_PASSWORD: learnhub
          POSTGRES_DB: learnhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnhub -d learnhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://learnhub:learnhub@localhost:5432/learnhub?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789-0123456789-abcdef
      JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789-0123456789-abcdef
      JWT_ACCESS_TTL_SECONDS: "900"
      JWT_REFRESH_TTL_SECONDS: "604800"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Jest needs require(esm) support to load the ESM-only NestJS packages,
      # which Node provides natively from 24.9 onwards.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm prisma generate

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Apply database migrations
        run: pnpm prisma migrate deploy

      - name: End-to-end tests
        run: pnpm test:e2e